<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'self' data:; base-uri 'none'; form-action 'none'; connect-src 'none'">
<meta name="theme-color" content="#2f6fde">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<title>加密／解密小工具</title>
<style>
:root{
  --bg:#f6f7f9;--card:#fff;--fg:#1d2330;--muted:#6b7280;--line:#e3e6eb;
  --accent:#2f6fde;--accent-fg:#fff;--ok:#1f8a4c;--warn:#b7791f;--danger:#c0392b;--code:#f1f3f6;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#12151b;--card:#1b2029;--fg:#e6e9ef;--muted:#9aa3b2;--line:#2c3340;
    --accent:#5b8ff0;--accent-fg:#0b1020;--ok:#4cc38a;--warn:#e0a84a;--danger:#ef6b5b;--code:#11151c}
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.55 system-ui,-apple-system,"Segoe UI","Noto Sans TC","Microsoft JhengHei",sans-serif}
header{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px 16px;padding-top:calc(12px + env(safe-area-inset-top));border-bottom:1px solid var(--line);background:var(--card);position:sticky;top:0;z-index:5}
header h1{font-size:17px;margin:0}
header a{font-size:13px;color:var(--accent);text-decoration:none}
main{max-width:820px;margin:0 auto;padding:0 16px calc(40px + env(safe-area-inset-bottom))}
nav{display:flex;gap:6px;padding:10px 16px;max-width:820px;margin:0 auto}
nav button{flex:1}
section{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-top:12px}
section[hidden]{display:none}
h2{font-size:16px;margin:0 0 4px}
label{display:block;font-size:13px;color:var(--muted);margin:12px 0 4px}
input,textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg);font:inherit}
textarea{min-height:120px;font-family:ui-monospace,Consolas,monospace;font-size:13px}
button{padding:10px 14px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--fg);font:inherit;cursor:pointer}
button.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
button.on{outline:2px solid var(--accent)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.row>button{flex:1 1 140px}
.hint{font-size:13px;color:var(--muted);margin:6px 0 0}
.out{margin-top:12px}
pre{white-space:pre-wrap;word-break:break-word;background:var(--code);padding:10px;border-radius:8px;font-size:13px;margin:0;max-height:46vh;overflow:auto}
.msg{font-size:13px;margin-top:8px;min-height:18px}
.msg.ok{color:var(--ok)}.msg.err{color:var(--danger)}
.seg{display:flex;gap:6px;margin-top:12px}
.seg button{flex:1}
[hidden]{display:none!important}
</style>
</head>
<body>
<header>
  <h1>🔐 加密／解密小工具</h1>
  <a href="index.html" id="backLink">← 交換站</a>
</header>

<nav>
  <button id="tabEnc" class="on" onclick="tab('enc')">加密</button>
  <button id="tabDec" onclick="tab('dec')">解密</button>
</nav>

<main>
  <section id="enc">
    <h2>加密</h2>
    <p class="hint">在自己的電腦輸入文字與密語，產生一段可複製的密文。把密文貼到任何地方都可以；只有輸入正確密語才能還原。交換站的「匯入小工具密文」可直接解開。</p>
    <div class="seg">
      <button id="modeText" class="on" onclick="setMode('text')">一般文字</button>
      <button id="modeCase" onclick="setMode('case')">案件格式</button>
    </div>
    <div id="textFields">
      <label>要加密的文字</label>
      <textarea id="encText" placeholder="貼上或輸入要加密的內容"></textarea>
    </div>
    <div id="caseFields" hidden>
      <label>標題</label><input id="cTitle" placeholder="例：訂單匯出 CSV 時間欄位錯亂">
      <label>問題描述（現象、重現步驟、預期結果）</label><textarea id="cDesc"></textarea>
      <label>環境 / 系統（語言版本、框架、DB…）</label><input id="cEnv">
      <label>程式碼 / 錯誤訊息</label><textarea id="cCode" style="min-height:180px"></textarea>
      <p class="hint">⚠️ 請先移除密碼、連線字串、API key、客戶個資等機敏內容。</p>
    </div>
    <label>密語（至少 12 字，建議 16 字以上；請勿與案件資料庫的密語相同）</label>
    <input id="encPass" type="password" autocomplete="off" placeholder="密語">
    <div class="row">
      <button class="primary" onclick="doEnc()">🔐 加密</button>
      <button onclick="clearEnc()">清空</button>
    </div>
    <div id="encMsg" class="msg"></div>
    <div class="out" id="encOutWrap" hidden>
      <label>密文（複製這一整段）</label>
      <pre id="encOut"></pre>
      <div class="row">
        <button class="primary" onclick="copyOut('encOut')">📋 複製密文</button>
      </div>
    </div>
  </section>

  <section id="dec" hidden>
    <h2>解密</h2>
    <p class="hint">貼上密文、輸入當初的密語，即可看到原文。密語只留在這個瀏覽器記憶體，不會上傳。</p>
    <label>密文</label>
    <textarea id="decText" placeholder="貼上 IR1: 開頭的密文"></textarea>
    <label>密語</label>
    <input id="decPass" type="password" autocomplete="off" placeholder="密語">
    <div class="row">
      <button class="primary" onclick="doDec()">🔓 解密</button>
      <button onclick="clearDec()">清空</button>
    </div>
    <div id="decMsg" class="msg"></div>
    <div class="out" id="decOutWrap" hidden>
      <label>原文</label>
      <pre id="decOut"></pre>
      <div class="row">
        <button class="primary" onclick="copyOut('decOut')">📋 複製原文</button>
      </div>
    </div>
  </section>
</main>

<script>
const ITER = 600000;                         // 與主程式一致
const ITER_MIN = 100000, ITER_MAX = 2000000;  // 解密時接受的運算次數範圍，避免惡意密文讓瀏覽器卡死
const IDLE_MS = 10 * 60 * 1000;
const te = new TextEncoder(), td = new TextDecoder();
const PREFIX = 'IR1:';                        // 密文格式標記
const $ = id => document.getElementById(id);

function toB64(buf){const u=new Uint8Array(buf);let s='';for(let i=0;i<u.length;i+=0x8000)s+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000));return btoa(s);}
function fromB64(b){const s=atob(b);const u=new Uint8Array(s.length);for(let i=0;i<s.length;i++)u[i]=s.charCodeAt(i);return u;}

async function deriveKey(pass, salt, iter){
  const base = await crypto.subtle.importKey('raw', te.encode(pass), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:iter,hash:'SHA-256'}, base,
    {name:'AES-GCM',length:256}, false, ['encrypt','decrypt']);
}

function tab(which){
  const enc = which==='enc';
  $('enc').hidden=!enc; $('dec').hidden=enc;
  $('tabEnc').classList.toggle('on',enc); $('tabDec').classList.toggle('on',!enc);
}
function setMsg(id,text,ok){const el=$(id);el.textContent=text;el.className='msg '+(ok?'ok':'err');}

// 案件格式：加密內容為 {"ir":"case",title,desc,env,code}，交換站匯入時會對應到各欄位
let mode='text';
function setMode(m){
  mode=m;
  $('textFields').hidden=m!=='text'; $('caseFields').hidden=m!=='case';
  $('modeText').classList.toggle('on',m==='text'); $('modeCase').classList.toggle('on',m==='case');
  setMsg('encMsg','',true); $('encOutWrap').hidden=true;
}
function caseText(o){
  return `【標題】${o.title}\n\n【問題描述】\n${o.desc||'（無）'}\n\n【環境 / 系統】\n${o.env||'（無）'}\n\n【程式碼 / 錯誤訊息】\n${o.code||'（無）'}`;
}
function parseCase(s){ try{const o=JSON.parse(s); if(o&&o.ir==='case') return o;}catch(e){} return null; }

async function doEnc(){
  let text;
  if(mode==='case'){
    const c={ir:'case',title:$('cTitle').value.trim(),desc:$('cDesc').value.trim(),env:$('cEnv').value.trim(),code:$('cCode').value};
    if(!c.title){setMsg('encMsg','請填寫標題',false);return;}
    text=JSON.stringify(c);
  } else text=$('encText').value;
  const pass=$('encPass').value;
  setMsg('encMsg','',true); $('encOutWrap').hidden=true;
  if(!text){setMsg('encMsg','請先輸入要加密的文字',false);return;}
  if(pass.length<12){setMsg('encMsg','密語太短，至少 12 字（建議 16 字以上）',false);return;}
  try{
    const salt=crypto.getRandomValues(new Uint8Array(16));
    const iv=crypto.getRandomValues(new Uint8Array(12));
    const key=await deriveKey(pass,salt,ITER);
    const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,te.encode(text));
    const pack={v:1,i:ITER,s:toB64(salt),n:toB64(iv),c:toB64(ct)};
    const token=PREFIX+toB64(te.encode(JSON.stringify(pack)));
    $('encOut').textContent=token; $('encOutWrap').hidden=false;
    $('encPass').value='';
    setMsg('encMsg','加密完成，請複製下方整段密文（密語欄已清空）。',true);
  }catch(e){setMsg('encMsg','加密失敗：'+e.message,false);}
}

async function doDec(){
  let raw=$('decText').value.trim(), pass=$('decPass').value;
  setMsg('decMsg','',true); $('decOutWrap').hidden=true;
  if(!raw){setMsg('decMsg','請先貼上密文',false);return;}
  if(!pass){setMsg('decMsg','請輸入密語',false);return;}
  let pack;
  try{
    if(raw.startsWith(PREFIX)) raw=raw.slice(PREFIX.length);
    pack=JSON.parse(td.decode(fromB64(raw.replace(/\s+/g,''))));   // 容許貼上時被自動換行
  }catch(e){setMsg('decMsg','解密失敗：密文不完整或格式不符。',false);return;}
  const iter=pack.i||ITER;
  if(!Number.isInteger(iter)||iter<ITER_MIN||iter>ITER_MAX){setMsg('decMsg','解密失敗：密文的運算次數異常，已拒絕處理。',false);return;}
  try{
    const key=await deriveKey(pass, fromB64(pack.s), iter);
    const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:fromB64(pack.n)}, key, fromB64(pack.c));
    const plain=td.decode(pt), c=parseCase(plain);
    $('decOut').textContent=c?caseText(c):plain; $('decOutWrap').hidden=false;
    $('decPass').value='';
    setMsg('decMsg',(c?'解密成功（案件格式）':'解密成功')+'，密語欄已清空，閒置 10 分鐘會自動清除畫面。',true);
  }catch(e){
    setMsg('decMsg','解密失敗：密語錯誤，或密文不完整／格式不符。',false);
  }
}

async function copyOut(id){
  const text=$(id).textContent;
  try{await navigator.clipboard.writeText(text);}
  catch(e){const r=document.createRange();r.selectNode($(id));const s=getSelection();s.removeAllRanges();s.addRange(r);document.execCommand('copy');s.removeAllRanges();}
  const msgId = id==='encOut'?'encMsg':'decMsg';
  setMsg(msgId,'已複製到剪貼簿。',true);
}

function clearEnc(){['cTitle','cDesc','cEnv','cCode'].forEach(i=>$(i).value='');$('encText').value='';$('encPass').value='';$('encOut').textContent='';$('encOutWrap').hidden=true;setMsg('encMsg','',true);}
function clearDec(){$('decText').value='';$('decPass').value='';$('decOut').textContent='';$('decOutWrap').hidden=true;setMsg('decMsg','',true);}

// 閒置 10 分鐘自動清空所有輸入與結果
let idleTimer;
function bumpIdle(){
  clearTimeout(idleTimer);
  idleTimer=setTimeout(()=>{
    clearEnc(); clearDec();
    setMsg('encMsg','閒置過久，已自動清除。',true); setMsg('decMsg','閒置過久，已自動清除。',true);
  },IDLE_MS);
}
['click','keydown','touchstart','input'].forEach(ev=>document.addEventListener(ev,bumpIdle,{passive:true}));
bumpIdle();

// 下載到本機執行時沒有主頁可回，隱藏返回連結
if(location.protocol==='file:') $('backLink').hidden=true;
if(!window.isSecureContext||!crypto.subtle){
  const m='此瀏覽器無法使用加密功能：線上請用 HTTPS 網址開啟；下載到電腦請用 Chrome 或 Edge 開啟。';
  setMsg('encMsg',m,false); setMsg('decMsg',m,false);
}
</script>
</body>
</html>
